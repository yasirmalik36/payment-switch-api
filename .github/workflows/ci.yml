name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PaymentSwitch.sln
      - name: Build
        run: dotnet build PaymentSwitch.sln --no-restore -c Release
      - name: Test
        run: dotnet test PaymentSwitch.sln --no-build -c Release --verbosity normal
